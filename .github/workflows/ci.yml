name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test

  validate:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npm run assets:validate
      - run: npm run assets:audit-immersion
      - run: npm run audit:pedagogy
      - run: node scripts/check-pwa-manifest.mjs
      - run: npm run build
      - name: Verify health route module
        run: node -e "require('fs').accessSync('app/api/health/route.ts')"
      - name: Check core route bundle sizes
        run: |
          node -e "
          const fs = require('fs');
          const manifestPath = '.next/app-build-manifest.json';
          if (!fs.existsSync(manifestPath)) {
            console.warn('Build manifest not found; skipping bundle check.');
            process.exit(0);
          }
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const pages = manifest.pages ?? {};
          const budgets = [
            { label: 'lesson', match: '/learn/lesson/[lessonId]/page', maxKb: 450 },
            { label: 'review', match: '/review/page', maxKb: 400 },
            { label: 'camp', match: '/camp/page', maxKb: 400 },
          ];
          for (const budget of budgets) {
            const pageKey = Object.keys(pages).find((key) => key.includes(budget.match));
            if (!pageKey) {
              console.warn('Route not found for', budget.label, '- skipping.');
              continue;
            }
            const chunkFiles = pages[pageKey] ?? [];
            let totalBytes = 0;
            for (const file of chunkFiles) {
              const filePath = '.next/' + file;
              if (fs.existsSync(filePath)) {
                totalBytes += fs.statSync(filePath).size;
              }
            }
            const totalKb = Math.round(totalBytes / 1024);
            console.log(budget.label, 'route static chunks:', totalKb, 'KB');
            if (totalKb > budget.maxKb) {
              console.error(budget.label, 'route chunks exceed threshold:', totalKb, 'KB >', budget.maxKb, 'KB');
              process.exit(1);
            }
          }
          "

  lighthouse:
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: npm run start &
      - name: Wait for server
        run: npx wait-on http://127.0.0.1:3000 --timeout 120000
      - name: Lighthouse public routes
        run: |
          npx lighthouse http://127.0.0.1:3000/login \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices \
            --output=json \
            --output-path=./lighthouse-login.json \
            --quiet
          node scripts/check-lighthouse-scores.mjs lighthouse-login.json
      - name: Lighthouse authenticated routes
        if: ${{ secrets.LIGHTHOUSE_TEST_EMAIL != '' }}
        env:
          LIGHTHOUSE_TEST_EMAIL: ${{ secrets.LIGHTHOUSE_TEST_EMAIL }}
          LIGHTHOUSE_TEST_PASSWORD: ${{ secrets.LIGHTHOUSE_TEST_PASSWORD }}
          LIGHTHOUSE_LESSON_ID: ${{ secrets.LIGHTHOUSE_LESSON_ID }}
        run: |
          node scripts/lighthouse-auth-setup.mjs
          node scripts/lighthouse-authenticated.mjs http://127.0.0.1:3000/camp ./lighthouse-camp.json
          node scripts/lighthouse-authenticated.mjs http://127.0.0.1:3000/tree ./lighthouse-tree.json
          for report in lighthouse-camp.json lighthouse-tree.json; do
            if [ -f "$report" ]; then node scripts/check-lighthouse-scores.mjs "$report"; fi
          done
